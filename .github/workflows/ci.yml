name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NIM: nim
      C2_AGENT_PASSPHRASE: ci-only-agent-secret-change-me
      C2_WEB_USER: ci-operator
      C2_WEB_PASSWORD: ci-only-dashboard-password-change-me

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/nimble
          key: nimble-${{ hashFiles('*.nim') }}-v1
          restore-keys: nimble-

      - name: Install Nimble deps
        run: |
          nimble install -y nimcrypto winim ws
          nim --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install websockets requests cryptography pefile

      - name: Build baseline (server + 3 agents + crypto test)
        shell: powershell
        run: |
          $env:NIM = "nim"
          .\build.ps1
          if (-not (Test-Path build/c2_server.exe)) { throw "c2_server.exe missing" }

      - name: Crypto unit tests
        run: build/test_crypto.exe

      - name: Log crypto unit tests
        run: nim c -r -d:release --path:common --nimcache:tests/cache tests/test_log_crypto.nim

      - name: E2E harness (WS path)
        run: python tests/e2e_harness.py --start

      - name: IAT discipline (baseline)
        run: python tests/pe_imports.py build/agent_silent.exe

      - name: Hardened build + verification
        shell: powershell
        run: |
          .\build_hardened.ps1
          python tests/verify_hardened.py

      - name: Rebuild server and baseline (hardened wiped build/)
        shell: powershell
        run: |
          .\build.ps1
          if (-not (Test-Path build/c2_server.exe)) { throw "c2_server.exe missing after rebuild" }

      - name: Sentinel TG + WS compile checks (dummy creds)
        shell: powershell
        run: |
          .\build_sentinel.ps1 -Tg -Variant aggressive -BotToken "123456:AAADUMMY" -ChatId "0"
          .\build_sentinel.ps1 -Variant silent

      - name: Scan for leaked secrets
        run: python tests/scan_strings.py build/agent_silent.exe
        continue-on-error: true
